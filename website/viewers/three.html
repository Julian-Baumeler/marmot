<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0a; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .err { position: absolute; left: 12px; bottom: 36px; color: #e10600; font: 13px Helvetica, sans-serif; }
</style>
<script type="importmap">
{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/"}}
</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from "three";
import { STLLoader } from "three/addons/loaders/STLLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";

const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setClearColor(0x0a0a0a, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(32, 1, 0.01, 1000);
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(2.4, 3.2, 4);
scene.add(key);

let geo = await new STLLoader().loadAsync("../models/Engine2.stl?v=dl1");
geo.deleteAttribute("normal");
try { geo = mergeVertices(geo, 1e-4); } catch (e) {}
geo.computeVertexNormals();
const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
  color: 0xc5c9ce, metalness: 1, roughness: 0.25, envMapIntensity: 1.3,
}));
scene.add(mesh);
const box = new THREE.Box3().setFromObject(mesh);
const size = box.getSize(new THREE.Vector3());
mesh.position.sub(box.getCenter(new THREE.Vector3()));
const r = Math.max(size.x, size.y, size.z) || 1;
camera.position.set(r * 1.1, r * 0.45, r * 1.6);
camera.near = r / 200;
camera.far = r * 40;
camera.lookAt(0, 0, 0);

function resize() {
  const w = Math.max(innerWidth, 4);
  const h = Math.max(innerHeight, 4);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();
(function tick() {
  requestAnimationFrame(tick);
  mesh.rotation.y += 0.005;
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
