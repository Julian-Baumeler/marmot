  <!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="_split.css" />
</head>
<body>
<div class="pane" style="position:absolute;inset:0">
  <div id="host" style="position:absolute;inset:0"></div>
</div>
<script src="../section.js"></script>
<script src="engine2-data.js"></script>
<script type="module">
import {
  vtkFullScreenRenderWindow, vtkActor, vtkMapper, vtkPolyData, vtkPoints,
} from "../vendor/vtk/vtk-stl.js";

const data = await loadEngine2();

function polyUnindexed(pos) {
  const nVerts = pos.length / 3;
  const nTris = nVerts / 3;
  const points = vtkPoints.newInstance();
  points.setData(pos, 3);
  const cells = new Uint32Array(nTris * 4);
  for (let i = 0; i < nTris; i++) {
    cells[i * 4] = 3;
    cells[i * 4 + 1] = i * 3;
    cells[i * 4 + 2] = i * 3 + 1;
    cells[i * 4 + 3] = i * 3 + 2;
  }
  const pd = vtkPolyData.newInstance();
  pd.setPoints(points);
  pd.getPolys().setData(cells);
  return pd;
}
function actor(pd, color) {
  const mapper = vtkMapper.newInstance();
  mapper.setInputData(pd);
  const a = vtkActor.newInstance();
  a.setMapper(mapper);
  a.getProperty().setColor(color[0], color[1], color[2]);
  if (a.getProperty().setBackfaceCulling) a.getProperty().setBackfaceCulling(false);
  return a;
}

const fullWin = vtkFullScreenRenderWindow.newInstance({
  rootContainer: document.getElementById("host"),
  background: [0.06, 0.06, 0.06],
  controllerVisibility: false,
});
if (fullWin.setControllerVisibility) fullWin.setControllerVisibility(false);
if (fullWin.removeController) try { fullWin.removeController(); } catch (e) {}
const rw = fullWin.getRenderWindow();
const ren = fullWin.getRenderer();
const fullA = actor(polyUnindexed(data.positions), [0.78, 0.78, 0.8]);
ren.addActor(fullA);
const cutActors = (data.cutParts || []).map((p) => {
  const a = actor(polyUnindexed(p.positions), p.color);
  a.setVisibility(false);
  ren.addActor(a);
  return a;
});

const cam = ren.getActiveCamera();
cam.setPosition(data.radius * -1.43, data.radius * -0.76, data.radius * 0.35, false);
cam.setFocalPoint(data.radius * -0.08, data.radius * 0.12, -data.radius * 0.17);
cam.setViewUp(0, 0, 1);
if (cam.setViewAngle) cam.setViewAngle(data.fov * 180 / Math.PI);
ren.resetCameraClippingRange();
rw.render();

const p0 = cam.getPosition();
const f0 = cam.getFocalPoint();
let lastAz = Math.atan2(p0[1] - f0[1], p0[0] - f0[0]);
function keepPipeUp() {
  const f = cam.getFocalPoint();
  const p = cam.getPosition();
  const dx = p[0] - f[0], dy = p[1] - f[1], dz = p[2] - f[2];
  const r = Math.hypot(dx, dy, dz) || 1;
  const rxy = Math.hypot(dx, dy);
  if (rxy > r * 0.04) lastAz = Math.atan2(dy, dx);
  const maxElev = 1.22;
  let elev = Math.atan2(dz, Math.max(rxy, 1e-8));
  if (elev < 0) elev = 0;
  if (elev > maxElev) elev = maxElev;
  const rrxy = Math.cos(elev) * r;
  cam.setPosition(
    f[0] + Math.cos(lastAz) * rrxy,
    f[1] + Math.sin(lastAz) * rrxy,
    f[2] + Math.sin(elev) * r,
    false
  );
  cam.setFocalPoint(f[0], f[1], f[2]);
  cam.setViewUp(0, 0, 1);
}
const irenLock = fullWin.getInteractor();
if (irenLock.onAnimation) irenLock.onAnimation(() => keepPipeUp());
watchCut((on) => {
  fullA.setVisibility(!on);
  cutActors.forEach((a) => a.setVisibility(on));
  rw.render();
});
</script>
</body>
</html>
