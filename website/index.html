<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Raketentriebwerk · Präsentationsbegleiter</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --dim: #8a8a8a;
    --line: #222;
    --red: #e10600;
    --nav: 260px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
  img { max-width: 100%; display: block; }
  .shell {
    display: grid;
    grid-template-columns: var(--nav) minmax(0, 1fr);
    height: 100%;
  }
  nav {
    border-right: 1px solid var(--line);
    padding: 22px 16px 16px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .brand {
    font-size: 10px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 14px;
  }
  .modebtn {
    border: 1px solid var(--line);
    padding: 8px 10px;
    margin-bottom: 16px;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--dim);
    text-align: center;
    width: 100%;
  }
  .modebtn.on { border-color: #fff; color: #fff; }
  .modebtn:hover { color: #fff; border-color: #888; }
  .toc-label {
    margin: 0 8px 6px;
    font-size: 9px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #555;
    display: none;
  }
  body.praesi .toc-label { display: block; }
  .toc {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: auto;
    min-height: 0;
    flex: 1;
  }
  .toc button {
    padding: 7px 8px;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--dim);
    border-left: 1px solid transparent;
  }
  .toc button.on { color: #fff; border-left-color: #fff; }
  .toc button:hover { color: #fff; }
  .toc .sec {
    margin: 12px 8px 4px;
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #555;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    white-space: nowrap;
  }
  .toc .tag {
    letter-spacing: 0.08em;
    color: #9a9a9a;
    flex-shrink: 0;
  }
  .kicker {
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 10px;
  }
  .stagewrap {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    min-width: 0;
    min-height: 0;
    padding: 22px 36px 16px;
  }
  .top {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .rule { height: 1px; background: var(--line); margin: 14px 0 18px; }
  .slide {
    min-height: 0;
    min-width: 0;
    overflow: auto;
  }
  .foot {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--dim);
  }
  h1 { font-size: clamp(28px, 3.4vw, 44px); font-weight: 400; letter-spacing: 0.02em; }
  h2 { font-size: clamp(22px, 2.4vw, 32px); font-weight: 400; }
  .lede { color: var(--dim); margin-top: 10px; font-size: 16px; line-height: 1.45; max-width: 52em; }
  .metrics {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
    margin-top: 28px;
  }
  .metric { border-top: 1px solid #fff; padding-top: 14px; }
  .metric b {
    display: block;
    font-size: clamp(26px, 3vw, 40px);
    font-weight: 200;
    letter-spacing: 0.04em;
  }
  .metric span {
    display: block;
    margin-top: 8px;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .grid2 { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 28px; min-height: 0; height: 100%; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .card { border-top: 1px solid #fff; padding-top: 12px; }
  .card h3 { font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 8px; }
  .card p, .prose { color: #c8c8c8; font-size: 14px; line-height: 1.45; }
  .fig {
    border: 1px solid var(--line);
    background: #080808;
    overflow: hidden;
    min-height: 0;
  }
  .fig img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
    background: #111;
    image-orientation: from-image;
  }
  .cap {
    margin-top: 8px;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .eq {
    margin: 16px 0;
    padding: 16px 18px;
    border: 1px solid var(--line);
    font-size: 18px;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th, td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; }
  th { color: var(--dim); font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; font-size: 11px; }
  .barrow { display: grid; grid-template-columns: 90px 1fr 80px; gap: 10px; align-items: center; margin: 8px 0; font-size: 13px; }
  .bar { height: 8px; background: #1a1a1a; }
  .bar i { display: block; height: 100%; background: #fff; }
  .playbtn {
    margin-top: 14px;
    border: 1px solid #fff;
    padding: 8px 14px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-size: 11px;
  }
  .playbtn:hover { background: #fff; color: #000; }
  #theater {
    display: none;
    position: fixed; inset: 0;
    background: #000;
    z-index: 20;
    padding: 22px 32px 16px;
    grid-template-rows: auto minmax(0, 1fr) auto;
  }
  body.theater #theater { display: grid; }
  body.theater .shell { display: none; }
  .stage { position: relative; min-height: 0; border: 1px solid var(--line); background: #000; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; image-orientation: from-image; }
  .katex { color: #fff; }
  @media (max-width: 980px) {
    .shell { grid-template-columns: 1fr; }
    nav { display: none; }
    .metrics, .grid3 { grid-template-columns: 1fr 1fr; }
    .grid2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="shell">
  <nav>
    <div class="brand">IDPA 1383 · BBZB</div>
    <button type="button" class="modebtn" id="btn-praesi" aria-pressed="false">Präsi</button>
    <div class="toc-label" id="toc-label">Themen</div>
    <div class="toc" id="toc"></div>
  </nav>
  <div class="stagewrap">
    <div>
      <div class="top">
        <span id="kicker">Julian Baumeler · Mateusz Wnuk · Patrick Zaugg</span>
        <span id="count">01 / 19</span>
      </div>
      <div class="rule"></div>
    </div>
    <div class="slide" id="slide"></div>
    <div class="foot">
      <span>← → Folien · F Vollbild · P Präsi · Esc</span>
      <span id="hint">Präsentationsbegleiter</span>
    </div>
  </div>
</div>

<div id="theater">
  <div>
    <div class="top">
      <span id="t-title">Clip</span>
      <button type="button" id="btn-back">← Zurück zur Folie</button>
    </div>
    <div class="rule"></div>
  </div>
  <div class="stage"><video id="player" controls preload="metadata" playsinline></video></div>
  <div class="foot">
    <span id="t-meta"></span>
    <span>F Vollbild · Leertaste Play</span>
  </div>
</div>

<script>
const CLIPS = [
  { id:"01", code:"YG 1", file:"media/01-yg-1.mp4", poster:"posters/01-yg-1.jpg", tag:"1080p", dur:"0:50" },
  { id:"02", code:"YG 2", file:"media/02-yg-2.mp4", poster:"posters/02-yg-2.jpg", tag:"1080p", dur:"1:52" },
  { id:"03", code:"MG 3", file:"media/03-mg-3.mp4", poster:"posters/03-mg-3.jpg", tag:"4K", dur:"5:19" },
  { id:"04", code:"MG 4", file:"media/04-mg-4.mp4", poster:"posters/04-mg-4.jpg", tag:"4K", dur:"1:49" },
  { id:"05", code:"MF 5", file:"media/05-mf-5.mp4", poster:"posters/05-mf-5.jpg", tag:"1080p", dur:"2:10" },
  { id:"06", code:"MF 6", file:"media/06-mf-6.mp4", poster:"posters/06-mf-6.jpg", tag:"4K", dur:"1:45" },
  { id:"07", code:"MF 7", file:"media/07-mf-7.mp4", poster:"posters/07-mf-7.jpg", tag:"4K", dur:"0:52" },
];

function clipBtn(i) {
  const c = CLIPS[i];
  return `<button class="playbtn" type="button" onclick="openClip(${i})">▶ ${c.code} · ${c.dur} · ${c.tag}</button>`;
}

const THEMEN = [
  { sec:"Einleitung", who:"" },
  { sec:"Ventile", who:"M", speaker:"Mateusz Wnuk" },
  { sec:"Schubmessen", who:"P", speaker:"Patrick Zaugg" },
  { sec:"Brennkammer", who:"J", speaker:"Julian Baumeler" },
  { sec:"Tests", who:"ALLE" },
  { sec:"Schluss", who:"" },
];

const SLIDES = [
  { id:"titel", sec:"Einleitung", t:"Titel", praesi:false, html: `
    <h1>Vom Skizzenpapier<br>bis zu einem Weltrekord.</h1>
    <p class="lede">Wirtschaftlichstes Triebwerksentwicklungsprogramm im Bereich Kosten per Schubeinheit. Interdisziplinäre Projektarbeit, BBZB, 29. Mai 2026.</p>
    <div class="metrics">
      <div class="metric"><b>272 CHF</b><span>Totalkosten</span></div>
      <div class="metric"><b>2.46 kg</b><span>Schub · MF 7</span></div>
      <div class="metric"><b>110.6</b><span>CHF / kg Schub</span></div>
      <div class="metric"><b>7 Tests</b><span>YG → MG → MF</span></div>
    </div>`},
  { id:"leitfrage", sec:"Einleitung", t:"Leitfrage", html: `
    <p class="kicker">Einleitung · Leitfrage</p>
    <h2>Ist ein funktionsfähiges Triebwerk an tausende Franken gebunden?</h2>
    <p class="lede">Ferrari vs. Ford Model T. Nicht maximale Effizienz, sondern Herstellbarkeit, Kosteneffizienz und Skalierbarkeit. COTS plus Eigenfertigung. Druckgasförderung statt Turbopumpe.</p>
    <div class="fig" style="margin-top:22px;height:min(48vh,420px)"><img src="figures/raptor-iteration.png" alt="Raptor 1–3"></div>
    <p class="cap">Abb. 1 · Iteration Raptor — Vorbild für schnelle Hardware-Zyklen</p>`},
  { id:"kennzahlen", sec:"Einleitung", t:"Kennzahlen", html: `
    <h2>Was auf der Folie stehen muss.</h2>
    <div class="metrics">
      <div class="metric"><b>24.12 N</b><span>Schub F = Δℓ / k</span></div>
      <div class="metric"><b>15 mm</b><span>Federweg</span></div>
      <div class="metric"><b>1.608</b><span>N / mm Federkonstante</span></div>
      <div class="metric"><b>52 CHF</b><span>Triebwerk allein</span></div>
    </div>
    <div class="metrics">
      <div class="metric"><b>222 CHF</b><span>Infrastruktur</span></div>
      <div class="metric"><b>10 bar</b><span>Ethanol-Förderdruck N₂</span></div>
      <div class="metric"><b>4 / 10 bar</b><span>Gasregler O₂ / System</span></div>
      <div class="metric"><b>64 s</b><span>MG 3 Brenndauer</span></div>
    </div>
    <p class="lede" style="margin-top:22px">Geometrie Marmot: L<sub>c</sub> 166.7 mm · D<sub>c</sub> 27.9 mm · D<sub>t</sub> 11.4 mm · D<sub>e</sub> 16.1 mm. Kühlung: C<sub>p</sub> Ethanol ≈ 2.43 kJ/(kg·K).</p>`},
  { id:"architekturen", sec:"Einleitung", t:"Drei Architekturen", html: `
    <div class="grid3" style="height:100%">
      <div class="card"><h3>01 Kaltgas</h3><p>Inertgas durch Ventil und Düse. Zuverlässig, aber I<sub>sp</sub> zu klein für Hauptantrieb.</p></div>
      <div class="card"><h3>02 Turbopumpe</h3><p>Massive Kammerdrücke, leichte Tanks. Präzisionsschaufeln — widerspricht Low-Cost.</p></div>
      <div class="card" style="border-top-color:var(--red)"><h3>03 Druckgas</h3><p>Inertgas presst Treibstoff aus dem Tank. Keine rotierenden Teile. Gewählt.</p></div>
    </div>
    <div class="fig contain" style="margin-top:18px;height:min(46vh,380px)"><img src="figures/arch-druckgas.png" alt="Druckgasförderung"></div>
    <p class="cap">Abb. 5–6 · Open Cycle vs. Druckgasförderung (O₂ · N₂ · Ethanol)</p>`},
  { id:"treibstoffe", sec:"Einleitung", t:"Treibstoffe", html: `
    <h2>Propan-Gas → flüssiges Ethanol</h2>
    <p class="lede">Bernoulli: Förderung nur wenn Leitungsdruck &gt; Kammerdruck. Gasregler 4 bar + 10 m Schlauch = Druck-Budget-Problem. Ethanol: inkompressibel, höhere volumetrische Energiedichte, Kühlmittel.</p>
    <div class="eq" data-tex="I_{sp} = \\dfrac{F}{\\dot{m}} \\qquad \\dot{m} = \\rho \\, v \\, A"></div>
    <div class="eq" data-tex="C_p \\approx 2.43\\,\\mathrm{kJ/(kg\\cdot K)} \\quad \\Delta T_{\\mathrm{EtOH}} \\approx 7\\,\\mathrm{K/s} \\quad \\Delta T_{\\mathrm{O_2}} \\approx 126\\,\\mathrm{K/s}"></div>
    <div class="grid2" style="height:auto;margin-top:16px">
      <div class="fig" style="height:240px"><img src="figures/emb-051.png" alt="Drucktank"></div>
      <div>
        <p class="card"><h3>Drucktank</h3><p>5-Liter-LKW-Luftbehälter, 15.5 bar zulässig, Betrieb 10 bar N₂ über Ethanol. Flammpunkt 12 °C → Stickstoffpolster, kein Luftgemisch im Tank.</p></div>
      </div>
    </div>`},
  { id:"ventile", sec:"Ventile", t:"Ventile", html: `
    <p class="kicker">Ventile · M · Mateusz Wnuk</p>
    <h2>Elektronische Kugelhähne</h2>
    <p class="lede">MKS TinyBee · FluidNC · Homing über Mikroschalter. Totbereich 28 Schritte (Treibstoff) / 40 Schritte (O₂). 200 Schritte = 90° offen. Kreissegmentfläche:</p>
    <div class="eq" data-tex="A(h)=r^{2}\\cos^{-1}\\!\\left(1-\\dfrac{h}{r}\\right)-(r-h)\\sqrt{2rh-h^{2}}"></div>
    <table>
      <tr><th>Taste</th><th>Funktion</th><th>Taste</th><th>Funktion</th></tr>
      <tr><td>X / C</td><td>Treibstoff ±1</td><td>B / N</td><td>O₂ ±1</td></tr>
      <tr><td>W / S</td><td>beide im Verhältnis</td><td>H</td><td>Homing</td></tr>
      <tr><td>1–0</td><td>10 % … 100 %</td><td>O</td><td>Voröffnung</td></tr>
    </table>
    <p class="cap" style="margin-top:14px">Tabelle 1–2 · 50 % Öffnung = Schritt 120 / 80 % = 160</p>`},
  { id:"schubmessen", sec:"Schubmessen", t:"Messeinrichtung", html: `
    <div class="grid2">
      <div>
        <p class="kicker">Schubmessen · P · Patrick Zaugg</p>
        <h2>Schub über Federweg</h2>
        <p class="lede">3D-Drucker-X-Achse als Führung. Kofferwaage versagte. Zugfeder, kalibrierte Federkonstante. MF 7:</p>
        <div class="eq" data-tex="F = \\dfrac{\\Delta\\ell}{k} = \\dfrac{15\\,\\mathrm{mm}}{1.608\\,\\mathrm{N/mm}} = 24.12\\,\\mathrm{N} \\approx 2.46\\,\\mathrm{kg}"></div>
        <p class="lede">Nächste Version: digitale Wägezelle für eine Schubkurve.</p>
      </div>
      <div>
        <div class="fig" style="height:78%"><img src="figures/messe-feder.png" alt="Messeinrichtung"></div>
        <p class="cap">Abb. 18 · Finale Messeinrichtung</p>
      </div>
    </div>`},
  { id:"marmot", sec:"Brennkammer", t:"Marmot / Laval", html: `
    <div class="grid2">
      <div>
        <p class="kicker">Brennkammer · J · Julian Baumeler</p>
        <h2>Brennkammer Marmot</h2>
        <p class="lede">Konvergent-divergent (Lavaldüse): statischer Druck → kinetische Überschallströmung. Stahl, in fünf Tagen vom Plan zum Test.</p>
        <div class="eq" data-tex="A_t = \\dfrac{\\dot{m}_{tot} \\, C^*}{P_c}"></div>
        <div class="eq" data-tex="\\varepsilon = \\dfrac{A_e}{A_t} = \\dfrac{1}{M_e}\\left(\\dfrac{1+\\frac{\\gamma-1}{2}M_e^2}{(\\gamma+1)/2}\\right)^{\\frac{\\gamma+1}{2(\\gamma-1)}}"></div>
        <div class="eq" data-tex="L^* = \\dfrac{V_c}{A_t}"></div>
        <p class="cap">Halsfläche, Expansionsverhältnis, charakteristische Länge</p>
      </div>
      <div>
        <div class="fig" style="height:42%"><img src="figures/schweissen.png" alt="Schweissen Marmot"></div>
        <p class="cap">Abb. 19–21 · Rohr, Punktschweiss, Naht</p>
        <div class="fig" style="height:42%;margin-top:12px"><img src="figures/marmot-fertigung.png" alt="Marmot Fertigung"></div>
      </div>
    </div>`},
  { id:"regenerativ", sec:"Brennkammer", t:"Regenerativkühlung", html: `
    <div class="grid2">
      <div>
        <p class="kicker">Brennkammer · J · Julian Baumeler</p>
        <h2>Kühlmantel statt Schmelze</h2>
        <p class="lede">O₂/Propan &gt; 3457 °C. Stahl schmilzt ~1420–1460 °C. MG 4: Engine-rich, ~20 % Wandung abgetragen. Lösung: Ethanol durch den äusseren Mantel, dann Injektor — Wärme bleibt im Kreis.</p>
        <div class="fig contain" style="height:48%;margin-top:14px"><img src="figures/regen-kuehlung.png" alt="Regenkühlung Schema"></div>
        <p class="cap">Abb. 34 · Schema Regenerativkühlung</p>
      </div>
      <div>
        <div class="fig" style="height:85%"><img src="figures/buochs-stand.png" alt="Stand Buochs"></div>
        <p class="cap">Abb. 23 · Marmot auf dem Stand, Mirage-Verein Buochs</p>
      </div>
    </div>`},
  { id:"sieben", sec:"Tests", t:"Sieben Tests", html: `
    <p class="kicker">Tests · ALLE</p>
    <h2>YG · MG · MF</h2>
    <table>
      <tr><th>#</th><th>Code</th><th>Was passiert</th><th>Lektion</th></tr>
      <tr><td>01</td><td>YG 1</td><td>Propan + Druckluft, Y-Stück, Handventile</td><td>Dichtigkeit ok</td></tr>
      <tr><td>02</td><td>YG 2</td><td>reiner O₂, TinyBee, 10 m</td><td>Fernsteuerung ok, kein Überschall</td></tr>
      <tr><td>03</td><td>MG 3</td><td>Marmot 1, 10 % Ventil, 64 s</td><td>Stahl glüht nach</td></tr>
      <tr><td>04</td><td>MG 4</td><td>Volllast ungekühlter Stahl</td><td>Engine-rich, aktive Kühlung nötig</td></tr>
      <tr><td>05</td><td>MF 5</td><td>Ethanol + Regenkühlung</td><td>Lecks, Kupfergrün, schweissen</td></tr>
      <tr><td>06</td><td>MF 6</td><td>erster sichtbarer Schub, 50 %</td><td>Gusseisen-Naht reisst, Tank brennt</td></tr>
      <tr><td>07</td><td>MF 7</td><td>gebogenes Stahlrohr, Nennleistung</td><td>24.12 N · 2.46 kg</td></tr>
    </table>
    <p class="lede" style="margin-top:16px">Nächste Folien: Originalclips, volle Auflösung. Klick oder 1–7.</p>`},
  { id:"yg1", sec:"Tests", t:"YG 1", html: `
    <div class="grid2">
      <div>
        <h2>YG 1 · Minimaltest</h2>
        <p class="lede">Propan + Werkstatt-Druckluft in ein Messing-Y. Stickstoff in der Luft dämpft die Flamme. Beweis: Dichtungen und Layout halten.</p>
        ${clipBtn(0)}
      </div>
      <div class="fig"><img src="posters/01-yg-1.jpg" alt="YG 1"></div>
    </div>`},
  { id:"yg2", sec:"Tests", t:"YG 2", html: `
    <div class="grid2">
      <div>
        <h2>YG 2 · Fernsteuerung</h2>
        <p class="lede">Reiner Sauerstoff. TinyBee + FluidNC über 10 m. Endschalter ok. Ohne Laval-Düse: eher ferngesteuertes Gasschweissgerät als Rakete. Druck-Budget.</p>
        ${clipBtn(1)}
      </div>
      <div class="fig"><img src="posters/02-yg-2.jpg" alt="YG 2"></div>
    </div>`},
  { id:"mg3", sec:"Tests", t:"MG 3", html: `
    <div class="grid2">
      <div>
        <h2>MG 3 · Erste Kammer</h2>
        <p class="lede">Marmot 1, Software mit Zielposition 0–200. Ventile ~10 %, 64 s. Ohne Kühlung akkumuliert q̇ im Stahl — die Kammer glüht lange nach dem Cutoff.</p>
        ${clipBtn(2)}
      </div>

const toc = document.getElementById("toc");
const btnPraesi = document.getElementById("btn-praesi");
let idx = 0;
let praesi = false;
const TEAM = "Julian Baumeler · Mateusz Wnuk · Patrick Zaugg";

function modeFromQuery() {
  const raw = new URLSearchParams(location.search).get("mode") || "";
  const v = raw.normalize("NFC").toLowerCase();
  return v === "präsi" || v === "praesi" || v === "prasi" || v === "jpsm";
}

function themaOf(sec) {
  return THEMEN.find((x) => x.sec === sec) || { sec, who:"" };
}

function deck() {
  if (!praesi) return SLIDES;
  const lead = SLIDES.find((s) => s.id === "leitfrage");
  return [lead, ...SLIDES.filter((s) => s.praesi !== false && s.id !== "leitfrage")];
}

function typeset(el) {
  el.querySelectorAll("[data-tex]").forEach((n) => {
    const tex = n.getAttribute("data-tex");
    if (window.katex) katex.render(tex, n, { throwOnError: false, displayMode: true });
    else n.textContent = tex;
  });
}

function buildToc() {
  toc.replaceChildren();
  let lastSec = "";
  deck().forEach((s, i) => {
    if (s.sec !== lastSec) {
      const d = document.createElement("div");
      d.className = "sec";
      const meta = themaOf(s.sec);
      const name = document.createElement("span");
      name.textContent = meta.sec;
      d.appendChild(name);
      if (meta.who) {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = "(" + meta.who + ")";
        d.appendChild(tag);
      }
      toc.appendChild(d);
      lastSec = s.sec;
    }
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = String(i + 1).padStart(2, "0") + "  " + s.t;
    b.onclick = () => go(i);
    toc.appendChild(b);
  });
}

function syncChrome() {
  document.body.classList.toggle("praesi", praesi);
  btnPraesi.classList.toggle("on", praesi);
  btnPraesi.setAttribute("aria-pressed", praesi ? "true" : "false");
  btnPraesi.textContent = praesi ? "Präsi · an" : "Präsi";
  document.title = praesi
    ? "Raketentriebwerk · Präsentationsmodus"
    : "Raketentriebwerk · Präsentationsbegleiter";
}

function kickerText(s) {
  const t = themaOf(s.sec);
  if (t.who && t.speaker) return `${t.sec} (${t.who}) · ${t.speaker}`;
  if (t.who) return `${t.sec} (${t.who})`;
  return praesi ? t.sec : TEAM;
}

function go(i) {
  const d = deck();
  idx = (i + d.length) % d.length;
  const s = d[idx];
  document.getElementById("count").textContent =
    String(idx + 1).padStart(2, "0") + " / " + String(d.length).padStart(2, "0");
  document.getElementById("hint").textContent = s.t;
  document.getElementById("kicker").textContent = kickerText(s);
  const el = document.getElementById("slide");
  el.innerHTML = s.html;
  typeset(el);
  [...toc.querySelectorAll("button")].forEach((b, n) => b.classList.toggle("on", n === idx));
  const url = new URL(location.href);
  if (praesi) url.searchParams.set("mode", "präsi");
  else url.searchParams.delete("mode");
  history.replaceState(null, "", url.pathname + url.search + "#/" + (idx + 1));
}

function setPraesi(on) {
  const id = deck()[idx] && deck()[idx].id;
  praesi = on;
  syncChrome();
  buildToc();
  const n = deck().findIndex((s) => s.id === id);
  go(n >= 0 ? n : 0);
}

const player = document.getElementById("player");
function openClip(i) {
  const c = CLIPS[i];
  document.body.classList.add("theater");
  document.getElementById("t-title").textContent = c.code + "  ·  " + c.tag + "  ·  " + c.dur;
  document.getElementById("t-meta").textContent = c.file;
  player.poster = c.poster;
  player.src = c.file;
  player.load();
}
function closeTheater() {
  player.pause();
  document.body.classList.remove("theater");
}
document.getElementById("btn-back").onclick = closeTheater;
btnPraesi.onclick = () => setPraesi(!praesi);
player.addEventListener("dblclick", () => {
  const req = player.requestFullscreen || player.webkitRequestFullscreen;
  if (req) req.call(player);
});

window.addEventListener("keydown", (e) => {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const th = document.body.classList.contains("theater");
  if (e.key === "Escape") { if (!document.fullscreenElement && th) closeTheater(); return; }
  if (th && (e.key === " " || e.key === "f" || e.key === "F")) {
    e.preventDefault();
    if (e.key === " ") { if (player.paused) player.play(); else player.pause(); }
    else { const req = player.requestFullscreen || player.webkitRequestFullscreen; if (req) req.call(player); }
    return;
  }
  if (th) return;
  if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); go(idx + 1); }
  if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(idx - 1); }
  if (e.key === "Home") go(0);
  if (e.key === "End") go(deck().length - 1);
  if (e.key >= "1" && e.key <= "7") openClip(Number(e.key) - 1);
  if (e.key === "p" || e.key === "P") { e.preventDefault(); setPraesi(!praesi); }
  if (e.key === "f" || e.key === "F") {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) req.call(el);
  }
});

function boot() {
  praesi = modeFromQuery();
  syncChrome();
  buildToc();
  const m = location.hash.match(/^#\/(\d+)$/);
  const d = deck();
  go(m ? Math.max(0, Math.min(d.length - 1, Number(m[1]) - 1)) : 0);
}
window.addEventListener("hashchange", boot);
if (window.katex) boot();
else window.addEventListener("load", boot);
</script>
